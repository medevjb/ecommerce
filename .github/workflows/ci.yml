name: Storefront CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/ecommerce-browser" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/ecommerce-browser/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Browser smoke tests
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/ecommerce-browser
        run: node --test tests/browser/smoke.test.mjs
